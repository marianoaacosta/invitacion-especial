  @keyframes spin { to { transform: rotate(360deg); } }
  .libra {
    position: absolute; left: 6%; top: calc(env(safe-area-inset-top, 0px) + 3%);
    width: min(150px, 38vw); height: auto; pointer-events: none; overflow: visible;
  }
  .libra line { stroke: rgba(209,169,94,.28); stroke-width: .8; }
  .libra .st { fill: #fdf8ec; filter: drop-shadow(0 0 3px rgba(255,248,225,.9)); animation: twinkle 3.2s ease-in-out infinite alternate; }
  .sky { position: absolute; inset: 0; pointer-events: none; }
  .sky i {
    position: absolute; border-radius: 50%; background: #fdf8ec;
    box-shadow: 0 0 4px 1px rgba(255,248,225,.55);
    animation: twinkle 3s ease-in-out infinite alternate;
  }
  .sky-fija { position: fixed; z-index: 0; }
  #invitacion .wrap { position: relative; z-index: 1; }
  @keyframes twinkle { 0% { opacity: .35; } 100% { opacity: 1; } }
  .candles { position: absolute; inset: 0; pointer-events: none; }
  .candle {
    position: absolute; bottom: 12%;
    width: 4px; border-radius: 2px;
    background: linear-gradient(var(--bone), #b9ab93);
    opacity: .5;
  }
  .candle::before {
    content: ""; position: absolute; left: 50%; top: -14px;
    width: 8px; height: 12px; transform: translateX(-50%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(circle at 50% 70%, #fff4d0, var(--gold) 55%, transparent 72%);
    box-shadow: 0 0 18px 6px rgba(240,213,150,.35);
    animation: flicker 2.4s infinite ease-in-out alternate;
  }
  @keyframes flicker {
    0% { transform: translateX(-50%) scale(1); opacity: .9; }
    40% { transform: translateX(-52%) scale(1.08, .94); opacity: 1; }
    100% { transform: translateX(-48%) scale(.94, 1.06); opacity: .8; }
  }
  .seal { display: grid; gap: 22px; justify-items: center; position: relative; z-index: 1; padding-block: 48px; }
  .cross {
    width: 44px; height: 64px; color: var(--gold);
    filter: drop-shadow(0 0 14px rgba(209,169,94,.45));
  }
  .eyebrow {
    font-family: var(--sans); font-size: 12px; letter-spacing: .32em; text-transform: uppercase;
    color: var(--smoke); margin: 0;
  }
  .portada-title {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(34px, 10vw, 60px); line-height: 1.05; margin: 0;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-wrap: balance;
  }
  .portada-date {
    font-family: var(--serif); font-style: italic; font-size: clamp(20px, 5.4vw, 26px);
    color: var(--bone); margin: 0;
  }
  .tap {
    margin-top: 18px;
    display: inline-flex; align-items: center; gap: 12px;
    font-family: var(--display); font-size: 14px; letter-spacing: .24em; text-transform: uppercase;
    color: var(--gold-hi);
    padding: 14px 26px; border: 1px solid rgba(209,169,94,.55); border-radius: 999px;
    animation: breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { box-shadow: 0 0 0 0 rgba(209,169,94,.0); }
    50% { box-shadow: 0 0 28px 2px rgba(209,169,94,.28); }
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }

  /* ---------- Invitación ---------- */
  #invitacion {
    padding-block: 28px 48px;
    background:
      radial-gradient(ellipse 80% 40% at 50% 0%, rgba(209,169,94,.12), transparent 70%),
      var(--ink);
  }
  #invitacion { overflow: hidden; }
  #invitacion.enter .flyer { animation: rise 1.3s .12s cubic-bezier(.16,1,.3,1) both; }
  #invitacion.enter .respuesta h2 { animation: rise 1.1s .45s cubic-bezier(.16,1,.3,1) both; }
  #invitacion.enter .actions { animation: rise 1.1s .65s cubic-bezier(.16,1,.3,1) both; }
  #invitacion.enter .firma { animation: rise 1.1s 0s cubic-bezier(.16,1,.3,1) both; }
  @keyframes rise {
    0% { opacity: 0; transform: translateY(80vh) scale(.94); }
    60% { opacity: 1; }
    100% { opacity: 1; transform: none; }
  }
  #portada.leaving { animation: leave .5s ease-in forwards; pointer-events: none; }
  @keyframes leave { to { opacity: 0; transform: scale(1.06); filter: blur(4px); } }
  .wrap { max-width: 480px; margin-inline: auto; display: grid; gap: 26px; }
  .flyer {
    margin: 0;
    border-radius: 6px; overflow: hidden;
    border: 1px solid rgba(209,169,94,.35);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.8), 0 0 0 6px rgba(209,169,94,.06);
  }
  .flyer img { display: block; width: 100%; height: auto; }

  .respuesta { display: grid; gap: 18px; text-align: center; }
  .respuesta h2 {
    font-family: var(--display); font-weight: 500; font-size: 22px; letter-spacing: .06em;
    color: var(--gold-hi); margin: 0; text-wrap: balance;
  }
  .respuesta p.lead {
    font-family: var(--serif); font-size: 19px; line-height: 1.4; color: var(--bone); margin: 0;
  }
  .field { display: grid; gap: 8px; text-align: left; }
  .field label {
    font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--smoke);
  }
  .field input {
    font: 500 17px/1.3 var(--sans);
    color: var(--bone); background: var(--nave);
    border: 1px solid rgba(209,169,94,.35); border-radius: 10px;
    padding: 14px 16px; width: 100%; box-sizing: border-box;
  }
  .field input::placeholder { color: #6f6559; }
  .field input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(209,169,94,.2); }
  .field.error input { border-color: #c96a5a; }
  .hint { font-size: 13px; color: #d98b7b; min-height: 1.2em; margin: 0; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 56px; border-radius: 12px; text-decoration: none;
    font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .14em; text-transform: uppercase;
    transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }
  .btn-si {
    color: #1a1208;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold) 60%, #b48b45);
    box-shadow: 0 10px 24px -10px rgba(209,169,94,.7);
  }
  .btn-no {
    color: var(--bone);
    background: var(--nave);
    box-shadow: 0 8px 22px -8px rgba(0,0,0,.8);
    border: 1px solid rgba(239,230,214,.35);
  }
  .btn-no:hover { border-color: var(--bone); }
  .btn { flex-direction: column; gap: 4px; padding-block: 12px; }
  .btn .emo { font-size: 26px; line-height: 1; letter-spacing: 0; }

  .gracias {
    display: grid; gap: 12px; justify-items: center; padding: 22px 18px;
    border: 1px solid rgba(209,169,94,.3); border-radius: 12px; background: var(--nave);
  }
  .gracias h3 { font-family: var(--display); font-weight: 500; font-size: 20px; color: var(--gold-hi); margin: 0; }
  .gracias p { font-family: var(--serif); font-size: 18px; line-height: 1.4; margin: 0; }
  .gracias a { color: var(--gold-hi); font-family: var(--sans); font-size: 14px; }
  .link-btn { background: none; border: 0; color: var(--smoke); font: 400 14px var(--sans); text-decoration: underline; cursor: pointer; padding: 6px; }

  .firma { font-family: var(--serif); font-style: italic; font-size: 19px; letter-spacing: .02em; color: var(--gold); text-align: center; margin: 0; }

  .logo-btn {
    margin-top: 18px;
    display: block; width: min(180px, 46vw); aspect-ratio: 1; border-radius: 50%; overflow: hidden;
    border: 2px solid rgba(209,169,94,.6);
    animation: pulse 1.6s ease-in-out infinite;
    transition: transform .15s ease;
  }
  .fechas { display: grid; gap: 14px; width: min(340px, 86vw); margin-top: 4px; }
  .fecha-btn {
    display: grid; gap: 4px; justify-items: center; cursor: pointer;
    padding: 16px 20px; border-radius: 18px;
    background: rgba(21,16,11,.72); color: var(--bone);
    border: 1px solid rgba(209,169,94,.55);
    font: inherit; -webkit-tap-highlight-color: transparent;
    animation: breathe 2.6s ease-in-out infinite;
    transition: transform .15s ease, background .2s ease;
  }
  .fecha-btn:nth-child(2) { animation-delay: 1.3s; }
  .fecha-btn:active { transform: scale(.97); }
  .fecha-btn:hover { background: rgba(209,169,94,.12); }
  .fecha-btn:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }
  .fecha-dia {
    font-family: var(--display); font-weight: 700; font-size: clamp(19px, 5.4vw, 23px);
    letter-spacing: .08em; text-transform: uppercase; color: var(--gold-hi);
  }
  .fecha-lugar { font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--smoke); }
  .link-otra {
    justify-self: center; background: none; border: 0; cursor: pointer; padding: 6px 10px;
    font: 500 13px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--smoke);
    text-decoration: underline; text-underline-offset: 4px;
  }
  .logo-btn img { display: block; width: 100%; height: 100%; object-fit: cover; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(160,60,255,.0), 0 0 30px 4px rgba(209,169,94,.15); transform: scale(1); }
    50% { box-shadow: 0 0 0 10px rgba(160,60,255,.12), 0 0 52px 14px rgba(255,90,120,.32); transform: scale(1.12); }
  }
  .tap-hint {
    font-family: var(--sans); font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: var(--smoke);
  }
  .sound {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 10;
    width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
    color: var(--gold-hi); background: rgba(21,16,11,.85); border: 1px solid rgba(209,169,94,.5);
    box-shadow: 0 6px 18px rgba(0,0,0,.5); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .sound:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }
  .sound svg { width: 22px; height: 22px; }
  .sound .off { display: none; }
  .sound.muted .on { display: none; }
  .sound.muted .off { display: inline; }
  .btn-no { position: relative; z-index: 5; transition: transform .38s cubic-bezier(.3,1.4,.5,1), background .2s ease; will-change: transform; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }

  /* ---------- Portada con la paleta del flyer (Q'Lokura – En Movimiento Tour) ---------- */
  #portada {
    --ql-night: #040229; --ql-cyan: #01b3cd; --ql-violet: #6905e3;
    --ql-magenta: #ed0191; --ql-orange: #fb582f; --ql-yellow: #fce207; --ql-lilac: #b9b2e6;
    --ql-grad: linear-gradient(180deg, var(--ql-violet), var(--ql-magenta) 38%, var(--ql-orange) 68%, var(--ql-yellow));
    background:
      radial-gradient(ellipse 70% 40% at 12% 30%, rgba(1,179,205,.42), transparent 70%),
      radial-gradient(ellipse 80% 55% at 45% 38%, rgba(40,20,190,.55), transparent 72%),
      radial-gradient(ellipse 110% 60% at 70% 100%, rgba(105,5,227,.40), transparent 65%),
      linear-gradient(180deg, var(--ql-night), #0a0640 55%, #000 100%);
  }
  #portada::before, #portada::after {
    content: ""; position: absolute; top: 8%; bottom: 8%; width: 6px; border-radius: 3px;
    pointer-events: none; opacity: .9;
  }
  #portada::before { left: 10px; background: var(--ql-grad); }
  #portada::after { right: 10px; background: linear-gradient(0deg, var(--ql-violet), var(--ql-magenta) 38%, var(--ql-orange) 68%, var(--ql-yellow)); }
  #portada .libra line { stroke: rgba(185,178,230,.35); }
  #portada .portada-title {
    background: none; color: #fff; -webkit-text-fill-color: #fff;
    text-shadow: 0 0 24px rgba(1,179,205,.35);
  }
  #portada .portada-date { color: var(--ql-yellow); }
  #portada .logo-btn {
    border: 3px solid transparent;
    background: var(--ql-grad) border-box;
    animation: ql-pulse 1.6s ease-in-out infinite;
  }
  @keyframes ql-pulse {
    0%,100% { box-shadow: 0 0 26px 2px rgba(237,1,145,.30); transform: scale(1); }
    50% { box-shadow: 0 0 44px 8px rgba(105,5,227,.50); transform: scale(1.04); }
  }
  #portada .tap-hint { color: var(--ql-lilac); }
  #portada .fecha-btn {
    background: linear-gradient(rgba(6,3,48,.82), rgba(6,3,48,.82)) padding-box,
                linear-gradient(90deg, var(--ql-violet), var(--ql-magenta), var(--ql-orange), var(--ql-yellow)) border-box;
    border: 1.5px solid transparent;
    animation: ql-breathe 2.6s ease-in-out infinite;
  }
  #portada .fecha-btn:nth-child(2) { animation-delay: 1.3s; }
  #portada .fecha-btn:hover {
    background: linear-gradient(rgba(40,20,120,.85), rgba(40,20,120,.85)) padding-box,
                linear-gradient(90deg, var(--ql-violet), var(--ql-magenta), var(--ql-orange), var(--ql-yellow)) border-box;
  }
  @keyframes ql-breathe {
    0%,100% { box-shadow: 0 0 0 0 rgba(237,1,145,0); }
    50% { box-shadow: 0 0 28px 2px rgba(237,1,145,.35); }
  }
  #portada .fecha-dia { color: var(--ql-yellow); }
  #portada .fecha-lugar { color: #fff; opacity: .85; }
  #portada .fecha-btn:focus-visible { outline-color: var(--ql-yellow); }
  @media (prefers-reduced-motion: reduce) {
    #portada .logo-btn, #portada .fecha-btn { animation: none; }
  }

  /* ---------- Fondo de la invitación del 31 con la paleta del flyer ---------- */
  #invitacion[data-fecha="31"] {
    background:
      radial-gradient(ellipse 70% 35% at 10% 22%, rgba(1,179,205,.40), transparent 70%),
      radial-gradient(ellipse 85% 45% at 50% 18%, rgba(40,20,190,.55), transparent 72%),
      radial-gradient(ellipse 110% 50% at 75% 95%, rgba(105,5,227,.40), transparent 65%),
      linear-gradient(180deg, #040229, #0a0640 55%, #000 100%);
    background-attachment: fixed;
  }

  /* ---------- Botones y detalles del 31 con la paleta del flyer ---------- */
  #invitacion[data-fecha="31"] .firma { color: #fce207; }
  #invitacion[data-fecha="31"] .respuesta h2 { color: #fff; }
  #invitacion[data-fecha="31"] .flyer {
    border: 1.5px solid transparent;
    background: linear-gradient(90deg, #6905e3, #ed0191 45%, #fb582f 75%, #fce207) border-box;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.8), 0 0 36px -6px rgba(237,1,145,.45);
  }
  #invitacion[data-fecha="31"] .btn-si {
    color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.35);
    background: linear-gradient(120deg, #6905e3, #ed0191 55%, #fb582f);
    box-shadow: 0 10px 26px -8px rgba(237,1,145,.7);
  }
  #invitacion[data-fecha="31"] .btn-no {
    color: #fff;
    background: linear-gradient(#070438, #070438) padding-box, linear-gradient(90deg, #6905e3, #ed0191 45%, #fb582f 75%, #fce207) border-box;
    border: 1.5px solid transparent;
    box-shadow: 0 8px 22px -8px rgba(105,5,227,.6);
  }
  #invitacion[data-fecha="31"] .btn:focus-visible { outline-color: #fce207; }
  #invitacion[data-fecha="31"] .gracias {
    background: linear-gradient(#070438, #070438) padding-box, linear-gradient(90deg, #6905e3, #ed0191 45%, #fb582f 75%, #fce207) border-box;
    border: 1.5px solid transparent;
  }
  #invitacion[data-fecha="31"] .gracias h3 { color: #fce207; }
  #invitacion[data-fecha="31"] .gracias a { color: #fce207; }
  #invitacion[data-fecha="31"] .link-btn,
  #invitacion[data-fecha="31"] .link-otra { color: #b9b2e6; }
</style>
</head>

<script>
  // Número de WhatsApp que recibe las respuestas (código de país + área, sin 0 ni 15)
  const WHATSAPP = "5493856887705";
  const FECHAS = {
    '17': { evento: "Q'baile Dios! – Espacio VIP, sábado 17 de octubre en Plaza de la Música", corta: 'el sábado 17' },
    '31': { evento: "Q'Lokura – Espacio VIP, sábado 31 de octubre en Plaza de la Música", corta: 'el sábado 31' }
  };
  let fecha = '17';

  const portada = document.getElementById('portada');
  const invitacion = document.getElementById('invitacion');
  const NOMBRE = 'Ana Cecilia Mujica';
  const btnSi = document.getElementById('btn-si');
  const btnNo = document.getElementById('btn-no');
  const respuesta = document.getElementById('respuesta');
  const gracias = document.getElementById('gracias');
  const reabrir = document.getElementById('reabrir');

  // Estrellas de fondo también en la invitación
  (() => {
    const sky2 = document.getElementById('sky2');
    let s = 11;
    const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    for (let i = 0; i < 46; i++) {
      const st = document.createElement('i');
      const size = 1.4 + rnd() * 1.8;
      st.style.left = (rnd() * 100) + '%';
      st.style.top = (rnd() * 100) + '%';
      st.style.width = st.style.height = size + 'px';
      st.style.animationDelay = (rnd() * 3) + 's';
      st.style.animationDuration = (2.2 + rnd() * 2.4) + 's';
      sky2.appendChild(st);
    }
  })();

  // Estrellas sueltas para acompañar la constelación
  const sky = document.getElementById('sky');
  [[18,4,1.6],[34,9,1.2],[44,3,1.4],[57,12,1],[66,5,1.5],[52,22,1.1],[29,24,1],[5,30,1.3],
   [92,30,1.2],[74,26,1],[88,40,1.4],[12,44,1],[96,12,1.1],[40,32,.9],[62,34,1],[3,14,1.2]
  ].forEach(([x, y, s], i) => {
    const st = document.createElement('i');
    st.style.left = x + '%'; st.style.top = y + '%';
    st.style.width = st.style.height = (s * 2) + 'px';
    st.style.animationDelay = (i * .41 % 3) + 's';
    st.style.animationDuration = (2.4 + (i % 4) * .6) + 's';
    sky.appendChild(st);
  });


  const sound = document.getElementById('sound');
  sound.addEventListener('click', () => {
    const m = document.getElementById('musica');
    m.muted = !m.muted;
    sound.classList.toggle('muted', m.muted);
    sound.setAttribute('aria-label', m.muted ? 'Activar música' : 'Silenciar música');
    if (!m.muted && m.paused) m.play().catch(() => {});
  });

  let entrando = false;
  function entrar(f) {
    if (entrando) return;
    entrando = true;
    fecha = f;
    invitacion.dataset.fecha = f;
    document.querySelectorAll('.flyer img').forEach(img => { img.hidden = img.dataset.fecha !== f; });
    respuesta.hidden = false; gracias.hidden = true;
    actualizar();
    // La música arranca con el toque (los celulares no permiten que suene sola)
    const musica = document.getElementById('musica');
    musica.volume = 0.8;
    musica.play().then(() => { sound.hidden = false; }).catch(() => {});
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    portada.classList.add('leaving');
    setTimeout(() => {
      portada.hidden = true;
      invitacion.hidden = false;
      invitacion.classList.add('enter');
      window.scrollTo(0, 0);
    }, reduce ? 0 : 450);
  }
  document.querySelectorAll('.fecha-btn').forEach(b => b.addEventListener('click', () => entrar(b.dataset.fecha)));

  function volver() {
    invitacion.hidden = true;
    invitacion.classList.remove('enter');
    portada.classList.remove('leaving');
    portada.hidden = false;
    entrando = false;
    window.scrollTo(0, 0);
    const otra = document.querySelector(`.fecha-btn:not([data-fecha="${fecha}"])`);
    if (otra) otra.focus({ preventScroll: true });
  }
  document.querySelectorAll('[data-otra]').forEach(b => b.addEventListener('click', volver));

  function mensaje(acepta) {
    const n = NOMBRE;
    const d = FECHAS[fecha].corta;
    return acepta
      ? `¡Hola! Acepto la invitación para ${d} (${FECHAS[fecha].evento}), ¡vamos! 🙌 ${n}`
      : `Hola, gracias por la invitación para ${d}, pero esta vez no voy a poder. ${n}`;
  }
  function link(acepta) {
    return `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(mensaje(acepta))}`;
  }
  function actualizar() {
    btnSi.href = link(true);
    btnNo.href = link(false);
  }
  actualizar();

  function responder(acepta, e) {
    actualizar();
    reabrir.href = link(acepta);
    document.getElementById('gracias-titulo').textContent = acepta ? '¡Qué bueno que venís!' : 'Gracias por avisar';
    // Mostramos la confirmación después de que el enlace se abra
    setTimeout(() => { respuesta.hidden = true; gracias.hidden = false; }, 300);
  }
  // "No puedo" se escapa las primeras 10 veces que intentan tocarlo
  const ESCAPES = 10;
  let escapes = 0, ultimoEscape = 0;
  function escapar(px, py) {
    if (escapes >= ESCAPES) return;
    escapes++; ultimoEscape = Date.now();
    // Posición "de casa" del botón, sin la transformación (offsetLeft/Top ignoran transform)
    const acts = btnNo.parentElement, ar = acts.getBoundingClientRect();
    const dentro = btnNo.offsetParent === acts;
    const r = { left: ar.left + btnNo.offsetLeft - (dentro ? 0 : acts.offsetLeft),
                top: ar.top + btnNo.offsetTop - (dentro ? 0 : acts.offsetTop),
                width: btnNo.offsetWidth, height: btnNo.offsetHeight };
    const vw = window.innerWidth, vh = window.innerHeight, m = 16;
    let x, y, intentos = 0;
    do {
      x = m + Math.random() * Math.max(1, vw - r.width - 2 * m);
      y = m + Math.random() * Math.max(1, vh - r.height - 2 * m);
      intentos++;
    } while (intentos < 20 && Math.hypot(x + r.width / 2 - px, y + r.height / 2 - py) < 160);
    const giro = (Math.random() * 16 - 8).toFixed(1);
    btnNo.style.transform = `translate(${x - r.left}px, ${y - r.top}px) rotate(${giro}deg)`;
    if (escapes === ESCAPES) {
      setTimeout(() => { btnNo.style.transform = 'none'; }, 1100);
    }
  }
  btnNo.addEventListener('pointerdown', e => {
    if (escapes < ESCAPES) { e.preventDefault(); escapar(e.clientX, e.clientY); }
  });
  btnNo.addEventListener('pointerenter', e => {
    if (e.pointerType === 'mouse') escapar(e.clientX, e.clientY);
  });
  btnNo.addEventListener('click', e => {
    if (escapes < ESCAPES || Date.now() - ultimoEscape < 1200) {
      e.preventDefault(); e.stopImmediatePropagation();
      if (e.detail === 0) { const r = btnNo.getBoundingClientRect(); escapar(r.left + r.width / 2, r.top + r.height / 2); }
    }
  }, true);

  btnSi.addEventListener('click', e => responder(true, e));
  btnNo.addEventListener('click', e => responder(false, e));
  document.getElementById('cambiar').addEventListener('click', () => {
    gracias.hidden = true; respuesta.hidden = false;
  });
</script>
</body>
